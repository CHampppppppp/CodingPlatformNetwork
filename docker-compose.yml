version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: interaction-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Interaction2024!}
      MYSQL_DATABASE: interaction_network_prod
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interaction-backend
    restart: always
    ports:
      - "3334:3334"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-Interaction2024!}@mysql:3306/interaction_network_prod
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
